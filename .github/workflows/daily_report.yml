name: Daily Morning Report

on:
   schedule:
    # 每天北京时间早上 9:47 (UTC 01:47) 自动触发
    - cron: '47 1 * * *'
  workflow_dispatch: # 依然保留随时手动点击测试的按钮

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装项目依赖
        run: |
          pip install -r requirements.txt

      - name: 执行晨报生成并发送邮件
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          SMTP_RECEIVER: ${{ secrets.SMTP_RECEIVER }}
        run: |
          python main.py
